<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aria Architecture</title>
  <desc id="desc">System flow diagram showing browser speech input, AI orchestration, and tool calls for Aura skincare support.</desc>

  <defs>
    <style>
      .title { font: 700 18px 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 600 12px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 11px 'Segoe UI', sans-serif; fill: #374151; }
      .box { stroke-width: 2; rx: 14; ry: 14; }
      .blue { fill: #dfeefb; stroke: #2a81c8; }
      .yellow { fill: #fbf0cf; stroke: #d9a72d; }
      .green { fill: #dff4e0; stroke: #4ca86a; }
      .purple { fill: #e8ddf9; stroke: #7b61c5; }
      .pink { fill: #f9dfe7; stroke: #db5d8a; }
      .gray { fill: #eef2f7; stroke: #5b6672; }
      .arrow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 7 7; }
      .prompt { fill: #fdf4db; stroke: #d9a72d; stroke-width: 2; }
      .callout { fill: #fff; stroke: #4b5563; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#f8fafc" />

  <!-- Left Column -->
  <g>
    <text x="145" y="32" class="title">Browser (Next.js client)</text>

    <rect x="42" y="55" width="230" height="62" class="box blue"/>
    <text x="157" y="92" text-anchor="middle" class="label">Microphone</text>

    <line x1="157" y1="117" x2="157" y2="145" class="arrow"/>

    <rect x="46" y="145" width="230" height="62" class="box blue"/>
    <text x="161" y="182" text-anchor="middle" class="label">Web Speech API STT</text>
    <text x="161" y="200" text-anchor="middle" class="small">(en-IN)</text>

    <line x1="161" y1="207" x2="161" y2="237" class="arrow"/>

    <rect x="58" y="237" width="210" height="66" class="box yellow"/>
    <text x="163" y="270" text-anchor="middle" class="label">Voice loop controller</text>
    <text x="163" y="287" text-anchor="middle" class="small">(restart, pause, barge-in)</text>

    <line x1="163" y1="303" x2="163" y2="345" class="arrow"/>

    <rect x="60" y="345" width="210" height="62" class="box blue"/>
    <text x="165" y="382" text-anchor="middle" class="label">Speech Synthesis TTS</text>
    <text x="165" y="399" text-anchor="middle" class="small">(Indian-English voice)</text>

    <line x1="165" y1="407" x2="165" y2="450" class="arrow"/>

    <rect x="64" y="450" width="200" height="54" class="box green"/>
    <text x="164" y="485" text-anchor="middle" class="label">Speakers</text>

    <path d="M 266 430 Q 335 430 335 316 Q 335 280 300 280" class="arrow dashed"/>
    <path d="M 266 263 Q 350 263 350 225" class="arrow dashed"/>

    <text x="100" y="515" class="small">End Call</text>
    <path d="M 160 510 L 160 545 Q 160 570 270 570 L 860 570" class="arrow dashed"/>
  </g>

  <!-- Middle Column -->
  <g>
    <text x="515" y="32" class="title">Next.js API routes (server)</text>

    <rect x="420" y="57" width="240" height="74" class="box purple"/>
    <text x="540" y="92" text-anchor="middle" class="label">System prompt</text>
    <text x="540" y="110" text-anchor="middle" class="small">Aura policy guardrails</text>

    <line x1="540" y1="131" x2="540" y2="172" class="arrow"/>

    <rect x="390" y="172" width="300" height="74" class="box purple"/>
    <text x="540" y="207" text-anchor="middle" class="label">POST /api/chat</text>
    <text x="540" y="225" text-anchor="middle" class="small">AI agent orchestration</text>

    <line x1="540" y1="246" x2="540" y2="280" class="arrow"/>

    <rect x="390" y="280" width="300" height="74" class="box purple"/>
    <text x="540" y="315" text-anchor="middle" class="label">Tool executor</text>
    <text x="540" y="333" text-anchor="middle" class="small">get_order_details</text>

    <path d="M 568 354 L 568 390 L 480 390 L 480 420" class="arrow"/>
    <path d="M 512 354 L 512 420" class="arrow"/>
    <path d="M 612 354 L 612 390 L 700 390 L 700 420" class="arrow"/>

    <line x1="540" y1="172" x2="440" y2="172" class="arrow dashed"/>
    <line x1="540" y1="172" x2="640" y2="172" class="arrow dashed"/>

    <rect x="385" y="420" width="200" height="72" class="box pink"/>
    <text x="485" y="454" text-anchor="middle" class="label">Gemini LLM</text>
    <text x="485" y="472" text-anchor="middle" class="small">Reasoning + function calls</text>

    <rect x="595" y="420" width="200" height="72" class="box green"/>
    <text x="695" y="454" text-anchor="middle" class="label">Mock orders DB</text>
    <text x="695" y="472" text-anchor="middle" class="small">(in-memory)</text>

    <line x1="540" y1="420" x2="540" y2="390" class="arrow dashed"/>
    <text x="525" y="410" class="small">reply</text>

    <rect x="410" y="515" width="260" height="58" class="box purple"/>
    <text x="540" y="550" text-anchor="middle" class="label">POST /api/summary</text>

    <path d="M 560 420 L 560 500" class="arrow"/>
    <path d="M 695 492 L 695 515" class="arrow"/>
  </g>

  <!-- Right Column -->
  <g>
    <text x="970" y="32" class="title">Google AI Studio + data</text>

    <rect x="860" y="58" width="260" height="430" class="box green"/>

    <text x="990" y="92" text-anchor="middle" class="label">Gemini</text>
    <text x="990" y="110" text-anchor="middle" class="small">LLM + tool use</text>

    <rect x="880" y="145" width="220" height="72" class="box pink"/>
    <text x="990" y="180" text-anchor="middle" class="label">Gemini LLM</text>
    <text x="990" y="198" text-anchor="middle" class="small">Reasoning + function calls</text>

    <rect x="880" y="255" width="220" height="72" class="box green"/>
    <text x="990" y="290" text-anchor="middle" class="label">Mock orders DB</text>
    <text x="990" y="308" text-anchor="middle" class="small">(in-memory)</text>

    <rect x="880" y="365" width="220" height="72" class="box gray"/>
    <text x="990" y="400" text-anchor="middle" class="label">Gemini</text>
    <text x="990" y="418" text-anchor="middle" class="small">call summary</text>

    <path d="M 995 217 L 995 255" class="arrow"/>
    <path d="M 995 327 L 995 365" class="arrow"/>
  </g>

  <!-- annotations -->
  <g>
    <rect x="478" y="160" width="90" height="24" class="callout"/>
    <text x="523" y="176" text-anchor="middle" class="small">prompt</text>

    <rect x="280" y="264" width="90" height="24" class="callout"/>
    <text x="325" y="280" text-anchor="middle" class="small">user text</text>

    <rect x="620" y="360" width="90" height="24" class="callout"/>
    <text x="665" y="376" text-anchor="middle" class="small">tool call</text>

    <rect x="600" y="186" width="90" height="24" class="callout"/>
    <text x="645" y="202" text-anchor="middle" class="small">response</text>
  </g>
</svg>
